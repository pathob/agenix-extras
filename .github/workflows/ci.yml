name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  flake-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: nix flake check (eval only)
        run: nix flake check --no-build

  vm-tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        test: [templates, restart-on-change, templates-home]

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Build and run ${{ matrix.test }}
        run: nix build --print-build-logs .#checks.x86_64-linux.${{ matrix.test }}
